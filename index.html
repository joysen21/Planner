.montage{--c:var(--mo)}.werkstatt{--c:var(--we)}.planung{--c:var(--pl)}.termin{--c:var(--tm)}.urlaub{--c:var(--ur)}

.ib.pl{background:var(--ac);border-color:var(--ac);color:#fff;font-size:22px}
