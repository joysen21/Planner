<nav>
<button data-t="plan" class="on"><span>📅</span>Plan</button>
<button data-t="offen"><span>📥</span><b id="oc">Offen</b></button>
<button data-t="mehr"><span>⚙️</span>Mehr</button>
</nav>
<dialog id="dlg"></dialog>

<script>
var S={jobs:[],hol:[]},tab='plan',mode='woche',an=fmt(new Date()),mvId=null,dm={},openId=null;
// Supabase: Anmeldung, Benutzer, Speichern
var USER_DOMAIN='planer.local',sb=null,ME=null,USERS=[],FLT='me',CH=null,rtT=null;
var COLORS=['#f27d0c','#1e7be0','#3d8b4f','#8e5bc0','#d03a3a','#b8860b','#16a3a3','#c2185b'];
function boot(){
 var C=window.PLANER_CONFIG||{};
 if(!C.url||!C.anonKey||!window.supabase){document.body.classList.add('auth');document.getElementById('main').innerHTML='<div class="login"><h1>Einrichtung fehlt</h1><p class="sub">In <b>config.js</b> die Supabase-URL und den anon-Key eintragen (siehe README).</p></div>';return}
 sb=window.supabase.createClient(C.url,C.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
 sb.auth.onAuthStateChange(function(ev){if(ev=='SIGNED_OUT'&&ME)showLogin()});
 sb.auth.getSession().then(function(r){if(r.data.session)enter();else showLogin()});
 document.addEventListener('visibilitychange',function(){if(!document.hidden&&ME)rt()})}
function showLogin(msg){ME=null;if(CH){sb.removeChannel(CH);CH=null}document.body.classList.add('auth');document.getElementById('dlg').open&&document.getElementById('dlg').close();
 document.getElementById('main').innerHTML='<form class="login" onsubmit="return doLogin(event)"><div class="lo"><img src="joke-icon.svg" alt=""><h1>Auftragsplaner<small>Bitte anmelden</small></h1></div>'+
 '<label>Benutzername oder E-Mail</label><input id="l_u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>'+
 '<label>Passwort</label><input id="l_p" type="password" autocomplete="current-password" required>'+
 '<div id="l_e" class="err">'+esc(msg||'')+'</div><button class="b p" style="width:100%;margin-top:8px">Anmelden</button><div class="brand">JoKe Smart Solutions</div></form>'}
function login2mail(u){u=u.trim().toLowerCase();return u.indexOf('@')>-1?u:u+'@'+USER_DOMAIN}
function doLogin(e){e.preventDefault();var b=e.target.querySelector('button');b.disabled=true;
 sb.auth.signInWithPassword({email:login2mail(document.getElementById('l_u').value),password:document.getElementById('l_p').value}).then(function(r){
  b.disabled=false;if(r.error){document.getElementById('l_e').textContent='Anmeldung fehlgeschlagen – Benutzername/E-Mail oder Passwort falsch.';return}enter()});return false}
async function enter(){
 var u=(await sb.auth.getUser()).data.user;if(!u){showLogin();return}
 var c=await sb.rpc('claim_admin');
 if(c.error){showLogin('Datenbank nicht eingerichtet: '+c.error.message);return}
 if(!c.data){await sb.auth.signOut();showLogin('Kein Zugang – bitte vom Admin als Benutzer anlegen lassen.');return}
 try{await loadAll()}catch(e){showLogin('Laden fehlgeschlagen: '+(e.message||e));return}
 ME=uById(u.id);ME.email=u.email;FLT='me';tab='plan';openId=null;mvId=null;
 document.body.classList.remove('auth');subscribe();render()}
async function loadAll(){
 var r=await Promise.all([sb.from('profiles').select('*').order('display_name'),sb.from('jobs').select('*'),sb.from('holidays').select('*').order('d')]);
 r.forEach(function(x){if(x.error)throw x.error});
 USERS=r[0].data;S.jobs=r[1].data.map(fromRow);S.hol=r[2].data;
 if(ME){var me=uById(ME.id);if(me){me.email=ME.email;ME=me}}}
function fromRow(r){return {id:r.id,kunde:r.kunde,adresse:r.adresse,tel:r.tel,art:r.art,wer:r.wer||[],start:r.start||'',tage:r.tage,zeit:r.zeit,ende:r.ende,fix:r.fix,imp:r.imp,material:r.material,notiz:r.notiz,done:r.done}}
function toRow(j){return {id:j.id,kunde:j.kunde||'',adresse:j.adresse||'',tel:j.tel||'',art:j.art,wer:j.wer||[],start:j.start||null,tage:Math.min(366,Math.max(1,j.tage||1)),zeit:j.zeit||'',ende:j.ende||'',fix:j.fix!==false,imp:!!j.imp,material:j.material!==false,notiz:j.notiz||'',done:!!j.done}}
function uuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16)})}
function fail(e){alert('Speichern fehlgeschlagen: '+(e&&e.message||e)+'\nDie Daten werden neu geladen.');reload()}
function reload(){return loadAll().then(render).catch(function(e){alert('Laden fehlgeschlagen: '+(e.message||e))})}
function save(j){if(j)sb.from('jobs').upsert(toRow(j)).then(function(r){if(r.error)fail(r.error)})}
function subscribe(){if(CH)sb.removeChannel(CH);CH=sb.channel('planer');['jobs','holidays','profiles'].forEach(function(t){CH.on('postgres_changes',{event:'*',schema:'public',table:t},rt)});CH.subscribe()}
// Änderungen anderer Benutzer nachladen, aber nicht mitten im Ziehen oder im offenen Dialog
function rt(){clearTimeout(rtT);rtT=setTimeout(function(){if(DG||RZ||document.getElementById('dlg').open||document.activeElement&&document.activeElement.closest&&document.activeElement.closest('main input,main textarea')){rt();return}reload()},500)}
function uById(id){return USERS.filter(function(u){return u.id==id})[0]}
function uName(id){var u=uById(id);return u?u.display_name:'?'}
function wer(j){return (j.wer||[]).filter(uById)}
function pcol(j){var w=wer(j);return w.length>1?'var(--pb)':w.length?uById(w[0]).color:''}
function wC(j){return pcol(j)?' wp':''}
function wS(j){var c=pcol(j);return c?'--pc:'+c+';':''}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function norm(s){var d=parse(s);while(d.getDay()==0||d.getDay()==6||HOL[fmt(d)])d.setDate(d.getDate()+1);return fmt(d)}
function nextWork(s,dir){var d=parse(s);do{d.setDate(d.getDate()+dir)}while(d.getDay()==0||d.getDay()==6||HOL[fmt(d)]);return fmt(d)}
function R(a){return a=='montage'||a=='werkstatt'||a=='planung'}
function isWE(ds){var g=parse(ds).getDay();return g==0||g==6||!!HOL[ds]}
var WEMSG='Montage, Planung und Werkstatt nur an Werktagen (Mo–Fr, ohne Feiertage).',HH=28,H0=6;
function span(j){var out=[],r=R(j.art),d=r?norm(j.start):j.start,n=j.zeit?1:j.tage;for(var i=0;i<n;i++){out.push(d);d=r?nextWork(d,1):addDays(d,1)}return out}
function t2m(t){var p=(t||'0:0').split(':');return +p[0]*60+(+p[1]||0)}
function m2t(m){m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
var WD=['So','Mo','Di','Mi','Do','Fr','Sa'],MN=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function kw(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function who(j){var w=wer(j);return w.length?w.map(uName).join(', '):'niemand zugeteilt'}
function byId(id){return S.jobs.filter(function(j){return j.id==id})[0]}

function render(){render0();document.getElementById('hd').insertAdjacentHTML('afterbegin','<button class="ib pl" onclick="nw()">＋</button>')}
function render0(){mkH();
 var hd=document.getElementById('hd'),m=document.getElementById('main');
 document.getElementById('oc').textContent='Offen ('+S.jobs.filter(function(j){return !j.start&&!j.done&&vis(j)}).length+')';
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t==tab)});
 if(tab=='plan'){plan(hd,m)}else if(tab=='offen'){
  hd.innerHTML='<h1>Noch ohne Termin'+fltSub()+'</h1>';
  var o=S.jobs.filter(function(j){return !j.start&&vis(j)});
  m.innerHTML=fltBar()+(o.length?o.map(function(j){return card(j,'')}).join(''):'<div class="empty big">📥<br><b>Nichts offen</b><br><small>Mit ＋ einen Auftrag ohne Termin anlegen</small></div>')
 }else{
  hd.innerHTML='<h1>Mehr</h1>';
  var adm=ME.role=='admin';
  m.innerHTML='<h2>Mein Konto</h2><div class="me">Angemeldet als <b>'+esc(ME.display_name)+'</b> · '+esc(ME.email&&ME.email.slice(-USER_DOMAIN.length-1)!='@'+USER_DOMAIN?ME.email:ME.username)+(adm?' · Admin':'')+'</div>'+
  '<label>Neues Passwort</label><div class="row"><input id="pw1" type="password" autocomplete="new-password" style="flex:1 1 160px"><button class="b" style="flex:none" onclick="ownPw()">Ändern</button></div>'+
  '<div class="row"><button class="b d" onclick="logout()">Abmelden</button></div>'+
  (adm?usec():'')+hsec(adm)+'<h2>Erledigte Aufträge</h2><div class="row"><button class="b" onclick="clearDone()">Erledigte löschen ('+S.jobs.filter(function(j){return j.done}).length+')</button></div>'+
  '<h2>Backup</h2><div class="sub">Die Daten liegen in der Datenbank und sind auf allen Geräten gleich. Hier kann eine Sicherung kopiert werden'+(adm?' – oder ein Backup der alten Handy-Version eingefügt und übernommen werden.':'.')+'</div>'+
  '<div class="row" style="margin-top:8px"><button class="b" onclick="exp()">Backup kopieren</button>'+(adm?'<button class="b p" onclick="imp()">Einfügen &amp; übernehmen</button>':'')+'</div><textarea id="bk" rows="5" placeholder="'+(adm?'Backup hier einfügen':'')+'"></textarea>'
 }
}
function usec(){
 return '<h2>Benutzer</h2><div class="sub">Benutzer melden sich mit Benutzername und Passwort an – ohne E-Mail.</div><div class="ul">'+USERS.map(function(u){var me=u.id==ME.id;
  return '<div class="ur"><input type="color" value="'+esc(u.color)+'" onchange="uUpd(\''+u.id+'\',{color:this.value})" title="Farbe im Kalender"><div class="nm"><input value="'+esc(u.display_name)+'" onchange="uUpd(\''+u.id+'\',{display_name:this.value.trim()||\''+esc(u.username)+'\'})"><small>'+(u.role=='admin'?'Admin · Anmeldung per E-Mail':'Benutzername: <b>'+esc(u.username)+'</b>')+'</small></div>'+
  (me?'':'<button class="b" onclick="uPw(\''+u.id+'\')">🔑 Passwort</button><button class="b d" onclick="uDel(\''+u.id+'\')">🗑</button>')+'</div>'}).join('')+'</div>'+
  '<div class="sec">Neuer Benutzer</div><div class="g2"><div><label>Name (Anzeige)</label><input id="u_n" placeholder="z. B. Stefan"></div><div><label>Benutzername</label><input id="u_u" placeholder="z. B. stefan" autocapitalize="none" autocorrect="off" spellcheck="false"></div>'+
  '<div><label>Passwort</label><input id="u_p" type="text" autocomplete="off" placeholder="mind. 6 Zeichen"></div><div><label>Farbe</label><input id="u_c" type="color" value="'+COLORS[USERS.length%COLORS.length]+'"></div></div>'+
  '<div class="row"><button class="b p" onclick="uNew(this)">＋ Benutzer anlegen</button></div>'}
function rpcErr(r){if(r.error){alert(r.error.message);return true}return false}
function uNew(b){var g=function(i){return document.getElementById(i).value.trim()},n=g('u_n'),u=g('u_u').toLowerCase(),p=document.getElementById('u_p').value;
 if(!/^[a-z0-9._-]{2,30}$/.test(u)){alert('Benutzername: 2–30 Zeichen, nur a–z, 0–9, Punkt, Minus, Unterstrich (keine Umlaute, keine Leerzeichen).');return}
 if(p.length<6){alert('Passwort: mindestens 6 Zeichen.');return}
 b.disabled=true;sb.rpc('admin_create_user',{p_username:u,p_password:p,p_display_name:n||u,p_color:g('u_c')}).then(function(r){b.disabled=false;if(rpcErr(r))return;alert('Benutzer angelegt.\n\nAnmeldung mit\nBenutzername: '+u+'\nPasswort: das eben vergebene');reload()})}
function uUpd(id,ch){var u=uById(id);Object.assign(u,ch);sb.from('profiles').update(ch).eq('id',id).then(function(r){if(r.error)fail(r.error);else render()})}
function uPw(id){var p=prompt('Neues Passwort für '+uName(id)+' (mind. 6 Zeichen):');if(p==null)return;if(p.length<6){alert('Passwort: mindestens 6 Zeichen.');return}
 sb.rpc('admin_set_password',{p_id:id,p_password:p}).then(function(r){if(!rpcErr(r))alert('Passwort geändert.')})}
function uDel(id){if(!confirm(uName(id)+' wirklich löschen? Die Person kann sich danach nicht mehr anmelden und wird aus allen Aufträgen entfernt.'))return;
 sb.rpc('admin_delete_user',{p_id:id}).then(function(r){if(!rpcErr(r)){if(FLT==id)FLT='me';reload()}})}
function ownPw(){var p=document.getElementById('pw1').value;if(p.length<6){alert('Passwort: mindestens 6 Zeichen.');return}
 sb.auth.updateUser({password:p}).then(function(r){if(r.error)alert(r.error.message);else{document.getElementById('pw1').value='';alert('Passwort geändert.')}})}
function logout(){sb.auth.signOut().then(function(){showLogin()})}
function card(j,ds){
 var o=openId==j.id,days=j.start?span(j):[],A=ART[j.art],id=j.id,mt=(j.art=='montage'||j.art=='werkstatt');
 var pos=ds&&days.length>1?' · Tag '+(days.indexOf(ds)+1)+'/'+days.length:(j.tage>1&&!j.start?' · '+j.tage+' Tage':'');
 var tg='<span class="tag fx">'+(PV(j)?'◌ provisorisch':'📌 fix')+'</span>';
 if(!j.material&&!j.done&&mt)tg+='<span class="tag bad">⚠ Material fehlt</span>';
 if(j.adresse)tg+='<span class="tag">📍 '+esc(j.adresse)+'</span>';
 var q=function(f,l,c){return '<button class="b '+(c||'')+'" onclick="'+f+'">'+l+'</button>'};
 var h='<div class="job a-'+j.art+wC(j)+' '+(PV(j)?'pv ':'fx ')+(j.done?'done ':'')+(o?'open':'')+'" style="'+wS(j)+'"><div class="jt" onclick="tog(\''+id+'\')"><div class="top"><div class="k">'+(j.imp?'<span class="starx">★</span> ':'')+esc(j.kunde||'(ohne Name)')+'</div><div class="ic"><button class="st" onclick="event.stopPropagation();impt(\''+id+'\')">'+(j.imp?'★':'☆')+'</button>'+A.ic+'</div></div>'+
 '<div class="sub">'+A.n+' · '+(wer(j).length>1?'👥 ':'')+esc(who(j))+pos+(j.zeit?' · 🕗 '+j.zeit+(j.ende?'–'+j.ende:''):'')+'</div><div class="tags">'+tg+'</div>'+(j.notiz?'<div class="sub nt">'+esc(j.notiz)+'</div>':'')+'</div><div class="acts">';
 if(j.start)h+='<div class="lbl">Verschieben</div><div class="g4">'+q("mv('"+id+"',-1)",'‹ Tag')+q("mv('"+id+"',1)",'Tag ›')+q("mv('"+id+"',7)",'+1 Wo.')+q("mv('"+id+"',0)",'Offen')+'</div>';
 h+='<div class="g2">'+q("pick('"+id+"')",'📆 Im Kalender')+q("fixt('"+id+"')",PV(j)?'📌 Fix setzen':'◌ Provisorisch')+'</div>';
 h+='<div class="g2">'+q("done('"+id+"')",j.done?'↺ Wieder öffnen':'✓ Erledigt',mt?'p':'p w')+(mt?q("mat('"+id+"')",j.material?'⚠ Material fehlt':'✔ Material da'):'')+'</div>';
 h+='<div class="ft2">'+(j.tel?'<a class="b" href="tel:'+esc(j.tel)+'">📞 Anrufen</a>':'')+(j.adresse?'<a class="b" target="_blank" href="https://maps.google.com/?q='+encodeURIComponent(j.adresse)+'">🗺 Route</a>':'')+q("edit('"+id+"')",'✎ Bearbeiten')+q("del('"+id+"')",'🗑','d')+'</div></div></div>';
 return h}
function tog(id){openId=openId==id?null:id;render()}
function mv(id,n){var j=byId(id);if(n==0)j.start='';else if(n==7)j.start=addDays(j.start,7);else j.start=R(j.art)?nextWork(norm(j.start),n):addDays(j.start,n);if(mode=='tag'&&j.start)an=j.start;save(j);render()}
function done(id){var j=byId(id);j.done=!j.done;save(j);render()}
function mat(id){var j=byId(id);j.material=!j.material;save(j);render()}
function del(id){if(confirm('Auftrag löschen?')){S.jobs=S.jobs.filter(function(j){return j.id!=id});render();sb.from('jobs').delete().eq('id',id).then(function(r){if(r.error)fail(r.error)})}}
function clearDone(){var ids=S.jobs.filter(function(j){return j.done}).map(function(j){return j.id});if(!ids.length||!confirm(ids.length+' erledigte Aufträge (aller Benutzer) löschen?'))return;
 S.jobs=S.jobs.filter(function(j){return !j.done});render();sb.from('jobs').delete().in('id',ids).then(function(r){if(r.error)fail(r.error)})}
function exp(){var t=JSON.stringify({jobs:S.jobs,hol:S.hol,users:USERS.map(function(u){return {id:u.id,name:u.display_name,username:u.username}})}),a=document.getElementById('bk');a.value=t;a.select();try{navigator.clipboard.writeText(t)}catch(e){}}
// Übernimmt Backups der alten Handy-Version (wer: b/1/2, Aushilfen a/o) und eigene Sicherungen
function imp(){var d;try{d=JSON.parse(document.getElementById('bk').value);if(!d.jobs)throw 0}catch(e){alert('Backup nicht lesbar.');return}
 var byName=function(n){n=String(n||'').trim().toLowerCase();var u=USERS.filter(function(x){return x.display_name.toLowerCase()==n||x.username==n})[0];return u?u.id:null};
 var nm=(d.names||[]).map(byName),miss=(d.names||[]).filter(function(n,i){return !nm[i]});
 var ex={};S.jobs.forEach(function(j){ex[j.id]=1});
 var rows=d.jobs.map(function(j){var w;
  if(Array.isArray(j.wer))w=j.wer.filter(uById);
  else{w=j.wer=='b'?[nm[0],nm[1]]:j.wer=='1'?[nm[0]]:j.wer=='2'?[nm[1]]:[];(j.hf||[]).forEach(function(x){w.push(nm[x=='a'?2:3])})}
  w=w.filter(function(x,i){return x&&w.indexOf(x)==i});
  var id=/^[0-9a-f-]{36}$/.test(j.id)?j.id:uuid();
  return toRow(Object.assign({},j,{id:id,wer:w,zeit:j.zeit||'',ende:j.ende||''}))});
 var neu=rows.filter(function(r){return !ex[r.id]}).length;
 if(!confirm(rows.length+' Aufträge übernehmen ('+neu+' neu, '+(rows.length-neu)+' werden überschrieben)?'+(miss.length?'\n\nOhne passenden Benutzer (bitte vorher anlegen, gleicher Name): '+miss.join(', '):'')))return;
 var hol=(d.hol||[]).map(function(h){return {d:h.d,n:h.n}});
 Promise.all([sb.from('jobs').upsert(rows),hol.length?sb.from('holidays').upsert(hol):{}]).then(function(r){var e=r.filter(function(x){return x.error})[0];if(e)fail(e.error);else{alert('Übernommen.');document.getElementById('bk').value='';reload()}})}

var ART={montage:{n:'Montage',ic:'🔧'},werkstatt:{n:'Werkstatt',ic:'🪚'},planung:{n:'Planung',ic:'📐'},termin:{n:'Termin',ic:'📌'},urlaub:{n:'Urlaub',ic:'🌴'}},COL={montage:'var(--mo)',werkstatt:'var(--we)',planung:'var(--pl)',termin:'var(--tm)',urlaub:'var(--ur)'};
var MF=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],MODES=[['tag','Tag'],['woche','Woche'],['monat','Monat'],['quartal','3 Mon.'],['jahr','Jahr']];
function plan(hd,m){
 var a=parse(an),t,h='';
 dm={};S.jobs.forEach(function(j){if(j.start&&vis(j))span(j).forEach(function(d){(dm[d]=dm[d]||[]).push(j)})});
 if(mode=='tag')t=WD[a.getDay()]+' '+a.getDate()+'. '+MN[a.getMonth()];
 else if(mode=='woche'){var w0=monday(a),e=new Date(w0);e.setDate(e.getDate()+6);t='KW '+kw(w0)+' · '+w0.getDate()+'.–'+e.getDate()+'. '+MN[e.getMonth()]}
 else if(mode=='monat')t=MF[a.getMonth()]+' '+a.getFullYear();
 else if(mode=='quartal'){var e2=new Date(a.getFullYear(),a.getMonth()+2,1);t=MN[a.getMonth()]+'–'+MN[e2.getMonth()]+' '+e2.getFullYear()}
 else t=''+a.getFullYear();
 hd.innerHTML='<button class="ib" onclick="step(-1)">‹</button><h1>'+t+fltSub()+'</h1><button class="ib" onclick="an=fmt(new Date());setMode(mode)">⌖</button><button class="ib" onclick="step(1)">›</button>';
 h+='<div class="seg modes">'+MODES.map(function(x){return '<button class="'+(mode==x[0]?'on':'')+'" onclick="setMode(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>';
